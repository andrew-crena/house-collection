<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Collection</title>
<style>

:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c26;
  --border: #2a2a3a;
  --accent: #7c6af7;
  --accent2: #a78bfa;
  --text: #f0eeff;
  --muted: #8888aa;
  --dim: #555570;
  --bpm-color: #a78bfa;
  --row-odd: #13131a;
  --row-even: #0f0f16;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  line-height: 1.5;
}

.container {
  max-width: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ── Header ── */
.header {
  padding: 20px 16px;
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  max-width: 800px;
  margin-left: auto;
  margin-right: auto;
}

.header-title {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
}

.track-count {
  font-size: 12px;
  color: var(--muted);
  background: var(--surface);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
}

/* ── Search ── */
.search-wrap {
  position: relative;
  max-width: 800px;
  margin: 0 auto;
}

.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--dim);
  font-size: 14px;
  pointer-events: none;
}

input[type="search"] {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px 10px 34px;
  color: var(--text);
  font-size: 15px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color 0.2s;
}

input[type="search"]::placeholder { color: var(--dim); }
input[type="search"]:focus { border-color: var(--accent); }

/* ── BPM Filter Bar ── */
.bpm-bar {
  padding: 12px 16px 0;
  background: var(--surface);
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}

.bpm-inner {
  max-width: 800px;
  margin: 0 auto;
}

.bpm-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.8px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.bpm-chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 12px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.bpm-chips::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  padding: 6px 13px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.chip:hover { border-color: var(--accent); }
.chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* ── Sort bar ── */
.sort-bar {
  display: flex;
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  flex-shrink: 0;
  max-width: 100%;
  overflow-x: auto;
}

.sort-inner { display: flex; max-width: 800px; margin: 0 auto; width: 100%; }

.sort-btn {
  flex: 1;
  padding: 10px 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  cursor: pointer;
  border: none;
  background: none;
  position: relative;
  transition: color 0.15s;
}

.sort-btn:last-child { max-width: 70px; }

.sort-btn:hover { color: var(--accent2); }
.sort-btn.active { color: var(--accent2); }
.sort-btn.active::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0; right: 0;
  height: 2px;
  background: var(--accent);
}

.sort-arrow { font-size: 9px; margin-left: 2px; opacity: 0.7; }

/* ── Main content area ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Track list ── */
.list-wrap {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

.list-inner {
  max-width: 800px;
  margin: 0 auto;
  width: 100%;
}

.track {
  display: flex;
  align-items: center;
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  gap: 10px;
  transition: background 0.1s;
}

.track:nth-child(odd) { background: var(--row-odd); }
.track:nth-child(even) { background: var(--row-even); }
.track:active { background: var(--surface2); }

.track-num {
  font-size: 10px;
  color: var(--dim);
  width: 24px;
  text-align: right;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.track-info {
  flex: 1;
  min-width: 0;
}

.track-title {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}

.track-artist {
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

.track-album {
  font-size: 10px;
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
}

.bpm-pill {
  flex-shrink: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
  text-align: center;
  min-width: 54px;
}

.bpm-value {
  font-size: 14px;
  font-weight: 700;
  color: var(--bpm-color);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.3px;
}

.bpm-tag {
  font-size: 8px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 1px;
}

/* ── Empty state ── */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: var(--dim);
  gap: 12px;
}

.empty-icon { font-size: 40px; }
.empty-text { font-size: 15px; }

/* Responsive */
@media (max-width: 600px) {
  .header-title { font-size: 20px; }
  .track { padding: 10px 12px; }
  .track-num { width: 20px; }
  .track-title { font-size: 12.5px; }
  .track-artist { font-size: 11px; }
  .bpm-pill { min-width: 50px; }
  input[type="search"] { font-size: 16px; }
}
</style>
</head>
<body>

<div class="container">

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div class="header-title">🎛 House Collection</div>
    <div class="track-count" id="countBadge">454 tracks</div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="search" id="searchInput" placeholder="Search title, artist, album…" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
</div>

<!-- BPM Filter -->
<div class="bpm-bar">
  <div class="bpm-inner">
    <div class="bpm-label">BPM Range</div>
    <div class="bpm-chips" id="bpmChips">
      <div class="chip active" data-min="0" data-max="999">All</div>
      <div class="chip" data-min="115" data-max="119">115–119</div>
      <div class="chip" data-min="120" data-max="122">120–122</div>
      <div class="chip" data-min="123" data-max="125">123–125</div>
      <div class="chip" data-min="126" data-max="128">126–128</div>
      <div class="chip" data-min="129" data-max="132">129–132</div>
      <div class="chip" data-min="133" data-max="999">133+</div>
    </div>
  </div>
</div>

<!-- Sort Bar -->
<div class="sort-bar">
  <div class="sort-inner">
    <button class="sort-btn active" data-sort="title">Title <span class="sort-arrow" id="arr-title">↑</span></button>
    <button class="sort-btn" data-sort="artist">Artist <span class="sort-arrow" id="arr-artist"></span></button>
    <button class="sort-btn" data-sort="bpm">BPM <span class="sort-arrow" id="arr-bpm"></span></button>
  </div>
</div>

<!-- Main content -->
<div class="main">
  <div class="list-wrap">
    <div class="list-inner" id="listWrap"></div>
  </div>
</div>

</div>

