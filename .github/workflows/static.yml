let sortKey = 'title';
let sortAsc = true;
let bpmMin = 0, bpmMax = 999;
let query = '';

function setSort(key) {
  if (sortKey === key) { sortAsc = !sortAsc; }
  else { sortKey = key; sortAsc = key !== 'bpm'; }
  ['title','artist','bpm'].forEach(k => {
    document.getElementById('arr-' + k).textContent = '';
    document.querySelector(`[data-sort="${k}"]`).classList.remove('active');
  });
  document.getElementById('arr-' + key).textContent = sortAsc ? '↑' : '↓';
  document.querySelector(`[data-sort="${key}"]`).classList.add('active');
  render();
}

document.getElementById('bpmChips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  bpmMin = parseFloat(chip.dataset.min);
  bpmMax = parseFloat(chip.dataset.max);
  render();
});

document.getElementById('searchInput').addEventListener('input', e => {
  query = e.target.value.toLowerCase().trim();
  render();
});

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => setSort(btn.dataset.sort));
});

function render() {
  let list = TRACKS.filter(t => {
    if (t.BPM < bpmMin || t.BPM > bpmMax) return false;
    if (query) {
      const q = query;
      return t.Title.toLowerCase().includes(q) ||
             t.Artist.toLowerCase().includes(q) ||
             t.Album.toLowerCase().includes(q);
    }
    return true;
  });

  list.sort((a, b) => {
    let av = sortKey === 'bpm' ? a.BPM : (sortKey === 'artist' ? a.Artist : a.Title);
    let bv = sortKey === 'bpm' ? b.BPM : (sortKey === 'artist' ? b.Artist : b.Title);
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });

  document.getElementById('countBadge').textContent = list.length + ' tracks';

  const wrap = document.getElementById('listWrap');
  if (list.length === 0) {
    wrap.innerHTML = '<div class="empty"><div class="empty-icon">🎵</div><div class="empty-text">No tracks found</div></div>';
    return;
  }

  wrap.innerHTML = list.map((t, i) => `
    <div class="track">
      <div class="track-num">${i+1}</div>
      <div class="track-info">
        <div class="track-title">${esc(t.Title)}</div>
        <div class="track-artist">${esc(t.Artist)}</div>
        ${t.Album ? `<div class="track-album">${esc(t.Album)}</div>` : ''}
      </div>
      <div class="bpm-pill">
        <div class="bpm-value">${t.BPM.toFixed(1)}</div>
        <div class="bpm-tag">BPM</div>
      </div>
    </div>
  `).join('');
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>

