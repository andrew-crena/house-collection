name: Sync Discogs collection

on:
  schedule:
    - cron: '17 11 * * *'     # daily, 11:17 UTC (early morning Pacific)
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: discogs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch collection
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}   # optional; works without it, just slower
        run: python3 scripts/sync_discogs.py andrewcrena
      - name: Commit if changed
        run: |
          git config user.name  "discogs-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Sync Discogs collection"
          git push
